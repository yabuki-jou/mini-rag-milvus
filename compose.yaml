services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # 容器运行时覆盖本地开发路径，数据统一写入持久化卷。
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mini_rag}:${POSTGRES_PASSWORD:-mini_rag}@postgres:5432/${POSTGRES_DB:-mini_rag}
      AGENT_CHECKPOINT_FILE: /app/data/agent_checkpoints.db
      FILE_STORAGE_DIR: /app/data/files
      LOG_FILE: /app/logs/app.log
      EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      # Compose 网络通过服务名寻址，容器内的 localhost 只指向 API 自身。
      MILVUS_URI: http://standalone:19530
    depends_on:
      postgres:
        condition: service_healthy
      standalone:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      # 默认使用当前工作区已有模型；其他机器可通过同名环境变量覆盖源目录。
      - type: bind
        source: ${EMBEDDING_MODEL_HOST_PATH:-../../py-doc/py-doc-deepseek-server/models/bge-small-zh-v1.5}
        target: /models/bge-small-zh-v1.5
        read_only: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_rag}
      POSTGRES_USER: ${POSTGRES_USER:-mini_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  standalone:
    image: milvusdb/milvus:v2.6.20
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  app_data:
  app_logs:
  etcd_data:
  minio_data:
  milvus_data:
